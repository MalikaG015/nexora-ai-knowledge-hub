spring.application.name=Technical

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b

spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=snapship-docs
spring.ai.vectorstore.pinecone.namespace=snapship-rag

spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.model.chat=openai

# MCP Client Configuration
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=nexora-application
spring.ai.mcp.client.type=SYNC

# Connect to Nexora MCP Server
spring.ai.mcp.client.streamable-http.connections.nexora-mcp-server.url=http://localhost:8090